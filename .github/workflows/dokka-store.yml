name: Store Dokka documentation

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Setup project
        uses: $/.github/actions/setup
        with:
          fetch-depth: 0

      - name: Generate Dokka docs
        run: ./gradlew dokkaGenerateHtml

      - name: Extract current version
        id: version
        run: |
          EXTRACTED_VERSION="$(./gradlew printCurrentVersion --quiet)"
          echo "Extracted version: $EXTRACTED_VERSION"
          echo "version=$EXTRACTED_VERSION" >> $GITHUB_OUTPUT

      # IMPORTANT: Checkout of Dokka branch is done AFTER generating docs
      - name: Checkout dokka branch
        uses: actions/checkout@v4
        with:
          ref: dokka
          path: dokka

      - name: Store generated docs in dokka branch
        run: ./gradlew storeDokkaHtml

      - name: Commit dokka branch
        uses: EndBug/add-and-commit@v10
        with:
          cwd: dokka
          message: Add/update Dokka documentation for v${{ steps.version.outputs.version }}

  publish:
    needs: build-and-store

    permissions:
      pages: write
      id-token: write

    uses: ./.github/workflows/dokka-publish.yml
