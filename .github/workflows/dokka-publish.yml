name: Publish Dokka documentation

on:
  push:
    branches:
      - dokka
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find latest release version
        id: version
        run: echo "version=$(./gradlew findLatestStableRelease --quiet)" >> $GITHUB_OUTPUT

      - name: Checkout latest release tag
        run: git checkout ${{ steps.version.outputs.version }}

      # IMPORTANT: Checkout of Dokka branch is done BEFORE generating docs
      - name: Checkout dokka branch
        uses: actions/checkout@v4
        with:
          ref: dokka
          path: dokka

      - name: Generate Dokka docs
        run: ./gradlew dokkaGenerateHtml

      - name: Upload to GitHub pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: library/build/dokka/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4