name: Publish Dokka documentation

on:
  push:
    branches:
      - dokka
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup project
        uses: $/.github/actions/setup
        with:
          fetch-depth: 0

      - name: Find latest release version
        id: version
        run: echo "version=$(./gradlew printLatestReleaseVersion --quiet)" >> $GITHUB_OUTPUT

      - name: Checkout latest release tag
        run: git checkout v${{ steps.version.outputs.version }}

      # IMPORTANT: Checkout of Dokka branch is done BEFORE generating docs
      - name: Checkout dokka branch
        uses: actions/checkout@v4
        with:
          ref: dokka
          path: dokka

      - name: "[Debug] List folders in dokka"
        run: ls -la dokka/stable/*

      - name: Generate Dokka docs
        run: ./gradlew dokkaGenerateHtml

      - name: "[Debug] List folders in generated docs"
        run: ls -la build/dokka/html/*

      - name: Upload to GitHub pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4