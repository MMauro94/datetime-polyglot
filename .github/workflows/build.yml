name: Build and test

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  verify-abi:
    name: "Verify ABI"
    runs-on: ubuntu-latest
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Binary Compatibility Validation
        run: ./gradlew checkKotlinAbi --scan

  verify-dokka:
    name: "Verify Dokka"
    runs-on: ubuntu-latest
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Generate Dokka
        run: ./gradlew dokkaGenerate --scan

  verify-ktlint:
    name: "Run Ktlint"
    runs-on: ubuntu-latest
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Run Ktlint
        run: ./gradlew ktlintCheck --scan

  verify-detekt:
    name: "Run Detekt"
    runs-on: ubuntu-latest
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Run Detekt
        run: ./gradlew detektAll --scan

  test:
    strategy:
      matrix:
        config: [
          { target: "JVM", os: "ubuntu-latest", tasks: "jvmTest" },
          { target: "JS (Node)", os: "ubuntu-latest", tasks: "jsNodeTest" },
        ]
    runs-on: ${{ matrix.config.os }}
    name: Test ${{ matrix.config.target }}
    needs: [verify-abi, verify-dokka, verify-ktlint, verify-detekt]
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Run ${{ matrix.config.target }} tests
        run: ./gradlew ${{ matrix.config.tasks }} --scan

  test-browser:
    strategy:
      matrix:
        config: [
          { target: "JS (Browser)", tasks: "jsBrowserTest" },
          { target: "WASM (Browser)", tasks: "wasmJsBrowserTest" },
        ]
    runs-on: ubuntu-latest
    name: Test ${{ matrix.config.target }}
    needs: [verify-abi, verify-dokka, verify-ktlint, verify-detekt]
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Setup headless Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Run tests in browser
        run: ./gradlew ${{ matrix.config.tasks }} --scan

  test-anrdoid:
    strategy:
      matrix:
        config: [
          { name: "Min SDK", sdk: "28" },
          { name: "Target SDK", sdk: "36" },
        ]
    runs-on: ubuntu-latest
    name: Test Android on ${{ matrix.config.name }} (${{ matrix.config.sdk }})
    needs: [verify-abi, verify-dokka, verify-ktlint, verify-detekt]
    steps:
      - name: Setup project
        uses: $/.github/actions/setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.config.sdk }}
          arch: x86_64
          script: ./gradlew connectedAndroidTest --scan
